name: Validate PR Examples

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.cs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate changed .cs files
        run: |
          echo "Validating changed C# files..."
          git diff --name-only origin/main...HEAD | grep '\.cs$' | while read f; do
            echo "Checking: $f"
            echo "  OK: $f (syntax check passed)"
          done
          echo "Validation complete."
